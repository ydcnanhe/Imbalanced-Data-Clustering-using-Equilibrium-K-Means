site_name: Equilibrium K-Means
site_description: Bilingual documentation for EKM & MiniBatchEKM (imbalanced data clustering)
site_url: ""
repo_url: ""
nav:
  - Home: index.md
  - API: api.md
  - 中文:
      - 首页: zh/index.md
      - API: zh/api.md
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.instant
    - content.code.copy
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
extra:
  social: []
extra_css: []
extra_javascript: []
